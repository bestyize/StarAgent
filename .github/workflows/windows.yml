name: Build Windows MSI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: StarAgentApp/StarAgent
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build MSI
        run: .\gradlew.bat --no-daemon :desktopApp:packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: staragent-windows-msi
          path: StarAgentApp/StarAgent/desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14
