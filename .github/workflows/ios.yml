name: Build iOS Simulator App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: StarAgentApp/StarAgent
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          app_path="$(find build/ios-simulator/Build/Products/Debug-iphonesimulator -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_path" build/artifacts/StarAgent-iOS-Simulator.zip

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v7
        with:
          name: staragent-ios-simulator
          path: StarAgentApp/StarAgent/build/artifacts/StarAgent-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
