name: Build macOS ARM64 DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: StarAgentApp/StarAgent
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Build ARM64 DMG
        run: ./gradlew --no-daemon :desktopApp:packageDmg

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: staragent-macos-arm64-dmg
          path: StarAgentApp/StarAgent/desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
