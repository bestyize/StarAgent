name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: StarAgentApp/StarAgent
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: staragent-debug-apk
          path: StarAgentApp/StarAgent/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
